name: marketpulse-tick

on:
  schedule:
    - cron: "*/30 * * * *"   # запасной реаниматор цепочки (крон GitHub ненадёжен)
  workflow_dispatch:
    inputs:
      step:
        description: "Что выполнить"
        default: "run"
        type: choice
        options: [run, tick, replay]
      hours:
        description: "Длительность run (ч), для проверки эстафеты можно 0.05"
        default: "5.6"
        type: string

permissions:
  actions: write   # чтобы задача могла запустить следующую себя
  contents: read

# одна активная задача; новая ждёт в очереди, а не дублирует торговлю
concurrency:
  group: marketpulse
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 355     # лимит GitHub — 6 часов
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          PYTHONPATH: src
          PYTHONUNBUFFERED: "1"
          RUN_MAX_HOURS: ${{ github.event.inputs.hours || '5.6' }}
        run: python -m marketpulse.cli ${{ github.event.inputs.step || 'run' }}
      - name: Pass the baton (start next run)
        if: success() && (github.event.inputs.step == 'run' || github.event_name == 'schedule')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run marketpulse-tick --ref main -f step=run
