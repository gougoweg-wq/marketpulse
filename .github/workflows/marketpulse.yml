name: marketpulse-tick

on:
  schedule:
    - cron: "*/15 * * * *"   # каждые 15 минут (UTC)
  workflow_dispatch:
    inputs:
      step:
        description: "Что выполнить"
        default: "tick"
        type: choice
        options: [tick, replay]

concurrency:
  group: marketpulse
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run pipeline step
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          PYTHONPATH: src
          PYTHONUNBUFFERED: "1"
        run: python -m marketpulse.cli ${{ github.event.inputs.step || 'tick' }}
